name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 */3 * *'   # a cada 3 dias, 09h (horario de Brasilia)
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        run: |
          KEY="sb_publishable_ZCrYlnw5op-ryimo73IdsQ_yoLq9EBV"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vbvyriijczkvufgcpchp.supabase.co/rest/v1/app_data?select=user_id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do Supabase: $STATUS"
          if [ "$STATUS" != "200" ]; then exit 1; fi
